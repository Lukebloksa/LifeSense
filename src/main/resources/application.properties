spring.application.name=LifeSense

jwt.secret=${JWT_SECRET:dev-secret-key}
jwt.expiration=86400

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/lifesense_db}
spring.datasource.username=${DB_USERNAME:myapp}
spring.datasource.password=${DB_PASSWORD:myapp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:mysql://localhost:3307/lifesense_db}
spring.flyway.user=${DB_USERNAME:myapp}
spring.flyway.password=${DB_PASSWORD:myapp}
spring.flyway.locations=classpath:db/migra
