services:
  mysql:
    image: 'mysql:8.4.7'
    container_name: lifesense-db
    environment:
      MYSQL_DATABASE: lifesense_db
      MYSQL_USER: myapp
      MYSQL_PASSWORD: myapp
      MYSQL_ROOT_PASSWORD: myapp
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
